name: Code Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm run test:admin-boundary
      - run: npm run test:content-api-boundary

      - name: Visual inspection delivery regression
        run: |
          npm install --prefix "$RUNNER_TEMP/fitbike-visual-tests" --no-package-lock --ignore-scripts @electric-sql/pglite@0.3.14 @imagemagick/magick-wasm@0.0.42
          MAGICK_WASM_MODULE="$RUNNER_TEMP/fitbike-visual-tests/node_modules/@imagemagick/magick-wasm/dist/index.js" PGLITE_MODULE="$RUNNER_TEMP/fitbike-visual-tests/node_modules/@electric-sql/pglite/dist/index.js" node --test --test-concurrency=1 scripts/content-factory/authoring.test.mjs scripts/content-factory/visual-pre-staging-worker.test.mjs scripts/content-factory/native-input-resume.test.mjs scripts/content-factory/visual-source-resume.test.mjs scripts/content-factory/visual-simplification.test.mjs scripts/content-factory/inspection-contract.test.mjs scripts/content-factory/inspection-delivery.test.mjs scripts/content-factory/visual-mcp-transport.test.mjs scripts/content-factory/visual-inspection-pixels.test.mjs scripts/content-factory/visual-delivery-sql.test.mjs scripts/content-factory/visual-deploy.test.mjs

