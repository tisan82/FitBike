name: Content Image Migration

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

concurrency:
  group: content-image-migration
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, 'CONTENT_IMAGE_MIGRATION:') && contains(github.event.issue.body, '<!-- FITBIKE_CONTENT_IMAGE_MIGRATION -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Internalize and optimize Production content images
        shell: bash
        env:
          CONTENT_IMAGE_MIGRATION_FUNCTION_URL: https://farjyjcvduthawpdjuqe.supabase.co/functions/v1/content-image-migrate
          SUPABASE_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhcmp5amN2ZHV0aGF3cGRqdXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNTU4OTMsImV4cCI6MjA5MjkzMTg5M30.EX3GclxMzkXuZE1n5EN-9BVFbTIRsSUuM1sHha9mI8Q
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/content-image-migration.json"
          node scripts/content-factory/migrate-external-content-images-browser.mjs | tee "$output"
          grep -q '"status": "PUBLISHED_VERIFIED"' "$output"
          grep -q '"remaining_external_hotlinks": 0' "$output"

      - name: Close completed migration issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Production content image migration completed and verified. Run: ${context.runId}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Report migration failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Production content image migration failed. Inspect workflow run ${context.runId}. This issue remains open for recovery.`
            });
