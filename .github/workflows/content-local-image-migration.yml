name: Content Local Image Migration

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    if: startsWith(github.event.issue.title, 'CONTENT_LOCAL_IMAGE_MIGRATION:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate local public content images to Supabase Storage
        shell: bash
        run: |
          set -o pipefail
          node scripts/content-factory/migrate-local-content-images-browser.mjs | tee /tmp/local-image-migration.log
          grep -q '"status": "LOCAL_IMAGE_MIGRATION_VERIFIED"' /tmp/local-image-migration.log
          grep -q '"remaining_local_refs": \[\]' /tmp/local-image-migration.log
      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Local content image migration completed and verified. Run: ${context.runId}` });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Local content image migration failed. Inspect workflow run ${context.runId}.` });
