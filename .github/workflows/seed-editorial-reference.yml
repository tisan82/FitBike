name: Seed Editorial Reference

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  seed:
    if: startsWith(github.event.issue.title, 'SEED_EDITORIAL_REFERENCE:')
    runs-on: ubuntu-latest
    steps:
      - name: Upload generated editorial reference
        shell: bash
        run: |
          set -o pipefail
          curl --fail-with-body --silent --show-error \
            'https://farjyjcvduthawpdjuqe.supabase.co/functions/v1/seed-editorial-reference-trigger?token=fitbike-editorial-seed-20260904-b7f1' \
            | tee /tmp/seed.json
          grep -q '"REFERENCE_UPLOADED"' /tmp/seed.json
      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Generated editorial reference uploaded and verified. Run: ${context.runId}` });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
