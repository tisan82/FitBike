<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="40" fill="#f8fafc"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">점검 → 기록 → 판단 → 조치</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="24" fill="#475569">주행거리만 보지 말고 실제 상태를 함께 확인하세요</text><g font-family="Arial,sans-serif"><g transform="translate(70 205)"><rect width="245" height="360" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><circle cx="122" cy="92" r="48" fill="#eef4ff"/><text x="122" y="104" text-anchor="middle" font-size="38" font-weight="700" fill="#064ae8">1</text><text x="122" y="180" text-anchor="middle" font-size="30" font-weight="700">실제 상태</text><text x="122" y="230" text-anchor="middle" font-size="22" fill="#475569">마모 · 균열 · 누유</text><text x="122" y="266" text-anchor="middle" font-size="22" fill="#475569">풀림 · 작동 이상</text></g><g transform="translate(340 205)"><rect width="245" height="360" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><circle cx="122" cy="92" r="48" fill="#eef4ff"/><text x="122" y="104" text-anchor="middle" font-size="38" font-weight="700" fill="#064ae8">2</text><text x="122" y="180" text-anchor="middle" font-size="30" font-weight="700">기록</text><text x="122" y="230" text-anchor="middle" font-size="22" fill="#475569">사진 · 날짜</text><text x="122" y="266" text-anchor="middle" font-size="22" fill="#475569">주행거리 · 증상</text></g><g transform="translate(610 205)"><rect width="245" height="360" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><circle cx="122" cy="92" r="48" fill="#eef4ff"/><text x="122" y="104" text-anchor="middle" font-size="38" font-weight="700" fill="#064ae8">3</text><text x="122" y="180" text-anchor="middle" font-size="30" font-weight="700">기준 비교</text><text x="122" y="230" text-anchor="middle" font-size="22" fill="#475569">제조사 기준</text><text x="122" y="266" text-anchor="middle" font-size="22" fill="#475569">이전 점검과 비교</text></g><g transform="translate(880 205)"><rect width="245" height="360" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><circle cx="122" cy="92" r="48" fill="#eef4ff"/><text x="122" y="104" text-anchor="middle" font-size="38" font-weight="700" fill="#064ae8">4</text><text x="122" y="180" text-anchor="middle" font-size="30" font-weight="700">다음 행동</text><text x="122" y="230" text-anchor="middle" font-size="22" fill="#475569">정상 → 재점검</text><text x="122" y="266" text-anchor="middle" font-size="22" fill="#475569">이상 → 정비 확인</text></g></g><rect x="70" y="615" width="1055" height="82" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="98" y="666" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#9a3412">안전 관련 이상이 있거나 판단이 어렵다면 임의 조정보다 전문 점검을 우선하세요.</text></svg>