<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="40" fill="#f8fafc"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">모델 가이드 확인 순서</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="24" fill="#475569">DB 규격 → 정확한 연식 → 실차 표기 → 공식 자료 순으로 교차 확인합니다</text><g font-family="Arial,sans-serif"><path d="M190 350H1010" stroke="#94a3b8" stroke-width="8"/><g transform="translate(180 350)"><circle r="72" fill="#064ae8"/><text y="12" text-anchor="middle" font-size="38" font-weight="700" fill="white">1</text><text y="130" text-anchor="middle" font-size="27" font-weight="700">모델명</text><text y="168" text-anchor="middle" font-size="21" fill="#475569">정확한 차종 확인</text></g><g transform="translate(460 350)"><circle r="72" fill="#064ae8"/><text y="12" text-anchor="middle" font-size="38" font-weight="700" fill="white">2</text><text y="130" text-anchor="middle" font-size="27" font-weight="700">연식 · 세대</text><text y="168" text-anchor="middle" font-size="21" fill="#475569">사양 변경 구간 확인</text></g><g transform="translate(740 350)"><circle r="72" fill="#064ae8"/><text y="12" text-anchor="middle" font-size="38" font-weight="700" fill="white">3</text><text y="130" text-anchor="middle" font-size="27" font-weight="700">실차 표기</text><text y="168" text-anchor="middle" font-size="21" fill="#475569">현재 장착 규격 확인</text></g><g transform="translate(1020 350)"><circle r="72" fill="#064ae8"/><text y="12" text-anchor="middle" font-size="38" font-weight="700" fill="white">4</text><text y="130" text-anchor="middle" font-size="27" font-weight="700">공식 기준</text><text y="168" text-anchor="middle" font-size="21" fill="#475569">장착 전 최종 확인</text></g></g><rect x="70" y="610" width="1055" height="88" rx="22" fill="#fff7ed"/><text x="98" y="665" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#9a3412">현재 장착 규격이 DB와 다르면 이전 교체 이력 또는 세대별 사양 차이를 먼저 확인하세요.</text></svg>