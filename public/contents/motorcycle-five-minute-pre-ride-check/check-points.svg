<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f7f9fc"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">5분 점검에서 실제로 볼 것</text><g font-family="Arial,sans-serif"><g transform="translate(80 145)"><rect width="500" height="260" rx="26" fill="#fff" stroke="#d7dfeb" stroke-width="3"/><text x="34" y="56" font-size="31" font-weight="700" fill="#111827">타이어·휠</text><text x="34" y="108" font-size="24" fill="#374151">• 공기압은 냉간 상태 기준 확인</text><text x="34" y="150" font-size="24" fill="#374151">• 못·나사·갈라짐·돌출 여부</text><text x="34" y="192" font-size="24" fill="#374151">• 휠의 균열·변형·이상 흔들림</text><text x="34" y="234" font-size="22" font-weight="700" fill="#b42318">빠른 압력 저하·손상 → 출발 중단</text></g><g transform="translate(620 145)"><rect width="500" height="260" rx="26" fill="#fff" stroke="#d7dfeb" stroke-width="3"/><text x="34" y="56" font-size="31" font-weight="700" fill="#111827">브레이크·조작계</text><text x="34" y="108" font-size="24" fill="#374151">• 앞·뒤 브레이크 각각 작동 확인</text><text x="34" y="150" font-size="24" fill="#374151">• 스로틀이 부드럽게 움직이고 복귀</text><text x="34" y="192" font-size="24" fill="#374151">• 레버·페달의 파손·과도한 유격</text><text x="34" y="234" font-size="22" font-weight="700" fill="#b42318">제동·스로틀 이상 → 출발 중단</text></g><g transform="translate(80 445)"><rect width="500" height="260" rx="26" fill="#fff" stroke="#d7dfeb" stroke-width="3"/><text x="34" y="56" font-size="31" font-weight="700" fill="#111827">등화·누유</text><text x="34" y="108" font-size="24" fill="#374151">• 전조등·방향지시등·제동등</text><text x="34" y="150" font-size="24" fill="#374151">• 바닥과 엔진 주변 새 액체 흔적</text><text x="34" y="192" font-size="24" fill="#374151">• 냉각수는 엔진이 식었을 때 확인</text><text x="34" y="234" font-size="22" font-weight="700" fill="#b42318">연료·브레이크액 의심 누유 → 운행 금지</text></g><g transform="translate(620 445)"><rect width="500" height="260" rx="26" fill="#fff" stroke="#d7dfeb" stroke-width="3"/><text x="34" y="56" font-size="31" font-weight="700" fill="#111827">차체·스탠드</text><text x="34" y="108" font-size="24" fill="#374151">• 헐거운 커버·볼트·적재물 확인</text><text x="34" y="150" font-size="24" fill="#374151">• 핸들이 걸림 없이 좌우로 움직임</text><text x="34" y="192" font-size="24" fill="#374151">• 사이드/센터스탠드 복귀와 고정</text><text x="34" y="234" font-size="22" font-weight="700" fill="#b42318">파손·간섭·고정 불량 → 먼저 점검</text></g></g><text x="600" y="800" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#4b5563">차종별 수치와 정비 기준은 반드시 해당 차량 매뉴얼을 우선합니다</text></svg>