<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f7f9fc"/><text x="80" y="92" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">출발해도 될까? GO / STOP 기준</text><g font-family="Arial,sans-serif"><rect x="80" y="150" width="500" height="520" rx="32" fill="#fff" stroke="#d7dfeb" stroke-width="3"/><circle cx="150" cy="225" r="38" fill="#e8f7ef"/><path d="M132 225l13 14 26-30" fill="none" stroke="#137a43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="238" font-size="34" font-weight="700" fill="#137a43">GO</text><text x="120" y="315" font-size="25" fill="#374151">• 타이어 외관 이상 없음</text><text x="120" y="365" font-size="25" fill="#374151">• 앞·뒤 브레이크 정상 작동</text><text x="120" y="415" font-size="25" fill="#374151">• 스로틀과 조작계 정상 복귀</text><text x="120" y="465" font-size="25" fill="#374151">• 등화장치 작동</text><text x="120" y="515" font-size="25" fill="#374151">• 새로운 누유 흔적 없음</text><text x="120" y="565" font-size="25" fill="#374151">• 차체·스탠드 고정 정상</text><text x="120" y="625" font-size="22" font-weight="700" fill="#111827">차종별 공식 수치가 필요한 항목은 매뉴얼로 확인</text><rect x="620" y="150" width="500" height="520" rx="32" fill="#fff" stroke="#f1c7c4" stroke-width="3"/><circle cx="690" cy="225" r="38" fill="#fdecea"/><path d="M675 210l30 30m0-30l-30 30" fill="none" stroke="#b42318" stroke-width="9" stroke-linecap="round"/><text x="750" y="238" font-size="34" font-weight="700" fill="#b42318">STOP</text><text x="660" y="315" font-size="25" fill="#374151">• 빠르게 빠지는 공기압 또는 타이어 손상</text><text x="660" y="365" font-size="25" fill="#374151">• 브레이크 작동 이상·누유</text><text x="660" y="415" font-size="25" fill="#374151">• 스로틀이 걸리거나 복귀하지 않음</text><text x="660" y="465" font-size="25" fill="#374151">• 연료 냄새·원인 불명 액체 누출</text><text x="660" y="515" font-size="25" fill="#374151">• 핸들 간섭·차체 파손·고정 불량</text><text x="660" y="565" font-size="25" fill="#374151">• 안전에 영향을 줄 이상이 원인 불명</text><text x="660" y="625" font-size="22" font-weight="700" fill="#b42318">애매하면 주행으로 시험하지 말고 먼저 점검</text></g></svg>