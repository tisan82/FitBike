<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#fff"/><style>.t{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111827}.s{font-family:Arial,"Noto Sans KR",sans-serif;fill:#4b5563}.b{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.p{fill:#064AE8}.r{fill:#d92d20}.w{stroke:#111827;stroke-width:8;fill:none;stroke-linecap:round}</style><text x="56" y="72" class="t" font-size="38" font-weight="700">Honda CB650R (2021) 배터리 위치·탈거 가이드</text><text x="56" y="112" class="s" font-size="22">Honda 2021 CB650R Owner’s Manual 기준 · 프런트 시트 제거 후 고무 밴드와 단자를 분리</text><rect x="48" y="150" width="1104" height="650" rx="28" class="b"/><g transform="translate(80 190)"><text class="t" font-size="27" font-weight="700">1. 프런트 시트를 분리하면 배터리에 접근할 수 있습니다</text><path d="M60 255 Q105 150 210 122 L360 105 Q455 98 525 150 L590 198 L555 245 L430 245 L378 190 L215 198 L155 255Z" fill="#d1d5db" stroke="#6b7280" stroke-width="5"/><circle cx="170" cy="275" r="58" fill="#111827"/><circle cx="495" cy="275" r="58" fill="#111827"/><path d="M270 116 Q345 85 425 105" class="w"/><rect x="292" y="150" width="150" height="88" rx="12" fill="#111827"/><path d="M366 150 L366 112" stroke="#064AE8" stroke-width="8"/><path d="M353 126 L366 110 L379 126" fill="#064AE8"/><text x="630" y="160" class="s" font-size="23">공식 절차 첫 단계는 프런트 시트 제거.</text><text x="630" y="200" class="s" font-size="23">시트 아래에서 배터리와 고무 밴드,</text><text x="630" y="240" class="s" font-size="23">양극/음극 단자를 확인합니다.</text><line x1="0" y1="355" x2="1040" y2="355" stroke="#dbe2ea" stroke-width="2"/><text y="405" class="t" font-size="27" font-weight="700">2. 고정 밴드 → 음극(-) → 양극(+) 순서로 분리합니다</text><rect x="30" y="442" width="260" height="140" rx="16" fill="#111827"/><rect x="58" y="466" width="205" height="90" rx="8" fill="#2f3540"/><path d="M75 454 H246" stroke="#6b7280" stroke-width="14"/><text x="50" y="612" class="s" font-size="20">① 고무 밴드 제거</text><path d="M338 510 H450" stroke="#064AE8" stroke-width="8"/><path d="M438 495 L460 510 L438 525" fill="#064AE8"/><rect x="498" y="442" width="260" height="140" rx="16" fill="#111827"/><rect x="526" y="466" width="205" height="90" rx="8" fill="#2f3540"/><circle cx="552" cy="498" r="14" fill="#9ca3af"/><circle cx="704" cy="498" r="14" fill="#d92d20"/><path d="M552 498 L500 538" stroke="#111827" stroke-width="10"/><text x="515" y="612" class="s" font-size="20">② 음극(-) 먼저 → 양극(+)</text><path d="M808 510 H900" stroke="#064AE8" stroke-width="8"/><path d="M888 495 L910 510 L888 525" fill="#064AE8"/><rect x="934" y="442" width="82" height="140" rx="12" fill="#111827"/><path d="M975 468 V545" stroke="#6b7280" stroke-width="8"/><path d="M955 522 Q975 556 995 522" fill="none" stroke="#064AE8" stroke-width="7"/><text x="920" y="612" class="s" font-size="20">③ 배터리 탈거</text></g><rect x="56" y="826" width="1088" height="46" rx="12" fill="#eef4ff"/><text x="76" y="857" class="t" font-size="20">설치: 역순으로 진행하고 배터리 단자는 반드시 양극(+)을 먼저, 음극(-)을 마지막에 연결합니다.</text></svg>