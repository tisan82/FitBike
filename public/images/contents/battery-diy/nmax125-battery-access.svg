<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#fff"/><style>.t{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111827}.s{font-family:Arial,"Noto Sans KR",sans-serif;fill:#4b5563}.b{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.p{fill:#064AE8}.r{fill:#d92d20}.w{stroke:#111827;stroke-width:8;fill:none;stroke-linecap:round}</style><text x="56" y="72" class="t" font-size="38" font-weight="700">Yamaha NMAX125 (2021) 배터리 위치·탈거 가이드</text><text x="56" y="112" class="s" font-size="22">2021 NMAX125 서비스 매뉴얼 기준 · 배터리는 시트 아래 전방, 커버는 나사 제거 후 뒤로 슬라이드</text><rect x="48" y="150" width="1104" height="650" rx="28" class="b"/><g transform="translate(80 190)"><text class="t" font-size="27" font-weight="700">1. 시트를 열면 앞쪽 끝에 배터리 커버가 있습니다</text><path d="M40 160 Q175 72 350 105 Q440 122 505 175 L555 215 Q580 238 560 285 H95 Q55 285 35 248Z" fill="#d1d5db" stroke="#6b7280" stroke-width="5"/><circle cx="165" cy="292" r="56" fill="#111827"/><circle cx="458" cy="292" r="56" fill="#111827"/><path d="M200 118 Q286 70 370 98" class="w"/><rect x="228" y="152" width="180" height="105" rx="16" fill="#1f2937"/><circle cx="258" cy="176" r="11" fill="#9ca3af"/><circle cx="378" cy="176" r="11" fill="#9ca3af"/><path d="M318 150 L318 112" stroke="#064AE8" stroke-width="8"/><path d="M305 126 L318 110 L331 126" fill="#064AE8"/><text x="600" y="160" class="s" font-size="23">위치: 시트 아래 앞쪽(힌지 쪽).</text><text x="600" y="198" class="s" font-size="23">커버 고정 나사를 풀고 커버를</text><text x="600" y="236" class="s" font-size="23">뒤쪽으로 밀어 분리합니다.</text><line x1="0" y1="355" x2="1040" y2="355" stroke="#dbe2ea" stroke-width="2"/><text y="405" class="t" font-size="27" font-weight="700">2. 커버를 벗기고 배터리를 꺼냅니다</text><rect x="30" y="442" width="260" height="140" rx="16" fill="#e5e7eb"/><rect x="58" y="465" width="205" height="92" rx="10" fill="#374151"/><circle cx="82" cy="492" r="12" fill="#9ca3af"/><circle cx="238" cy="492" r="12" fill="#d92d20"/><text x="45" y="612" class="s" font-size="20">① 커버 나사 제거 → 뒤로 슬라이드</text><path d="M338 510 H450" stroke="#064AE8" stroke-width="8"/><path d="M438 495 L460 510 L438 525" fill="#064AE8"/><rect x="498" y="442" width="260" height="140" rx="16" fill="#111827"/><rect x="526" y="466" width="205" height="90" rx="8" fill="#2f3540"/><circle cx="552" cy="498" r="14" fill="#9ca3af"/><circle cx="704" cy="498" r="14" fill="#d92d20"/><path d="M552 498 L500 538" stroke="#111827" stroke-width="10"/><text x="515" y="612" class="s" font-size="20">② 음극(-) → 양극(+) 순서</text><path d="M808 510 H900" stroke="#064AE8" stroke-width="8"/><path d="M888 495 L910 510 L888 525" fill="#064AE8"/><rect x="934" y="442" width="82" height="140" rx="12" fill="#111827"/><path d="M975 468 V545" stroke="#6b7280" stroke-width="8"/><path d="M955 522 Q975 556 995 522" fill="none" stroke="#064AE8" stroke-width="7"/><text x="920" y="612" class="s" font-size="20">③ 위로 탈거</text></g><rect x="56" y="826" width="1088" height="46" rx="12" fill="#eef4ff"/><text x="76" y="857" class="t" font-size="20">설치: 배터리를 같은 방향으로 넣고 양극(+) → 음극(-) 순서로 연결한 뒤 커버를 복원합니다.</text></svg>