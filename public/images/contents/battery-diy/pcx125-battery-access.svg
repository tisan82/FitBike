<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#fff"/><style>.t{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111827}.s{font-family:Arial,"Noto Sans KR",sans-serif;fill:#4b5563}.b{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.p{fill:#064AE8}.r{fill:#d92d20}.g{fill:#111827}.w{stroke:#111827;stroke-width:8;fill:none;stroke-linecap:round}</style><text x="56" y="72" class="t" font-size="38" font-weight="700">Honda PCX125 배터리 위치·탈거 가이드</text><text x="56" y="112" class="s" font-size="22">Honda 매뉴얼 + PCX 실차 작업 자료 기준 · 연식/세대에 따라 커버 형상은 달라질 수 있음</text><rect x="48" y="150" width="1104" height="650" rx="28" class="b"/><g transform="translate(80 190)"><text class="t" font-size="27" font-weight="700">1. 시트를 열고 배터리 커버를 찾습니다</text><path d="M40 150 Q180 65 340 100 Q410 115 455 160 L515 190 Q550 205 560 245 L535 290 H110 Q65 290 40 255Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="5"/><circle cx="155" cy="295" r="56" fill="#111827"/><circle cx="445" cy="295" r="56" fill="#111827"/><path d="M180 110 Q255 65 345 90" class="w"/><rect x="205" y="155" width="180" height="95" rx="16" fill="#111827"/><rect x="235" y="180" width="120" height="50" rx="8" fill="#374151"/><path d="M295 150 L295 115" stroke="#064AE8" stroke-width="8"/><path d="M282 128 L295 112 L308 128" fill="#064AE8"/><text x="590" y="155" class="s" font-size="23">PCX는 시트 아래 수납공간 안쪽의</text><text x="590" y="190" class="s" font-size="23">배터리 커버를 열어 접근합니다.</text><text x="590" y="230" class="s" font-size="23">Honda 공식 절차: 커버 → 밴드 → 단자.</text><line x1="0" y1="355" x2="1040" y2="355" stroke="#dbe2ea" stroke-width="2"/><text y="405" class="t" font-size="27" font-weight="700">2. 커버·밴드를 제거하고 단자를 분리합니다</text><rect x="40" y="440" width="250" height="140" rx="16" fill="#1f2937"/><rect x="60" y="465" width="210" height="95" rx="10" fill="#374151"/><rect x="88" y="483" width="155" height="58" rx="8" fill="#111827"/><circle cx="112" cy="512" r="13" fill="#9ca3af"/><circle cx="220" cy="512" r="13" fill="#d92d20"/><text x="70" y="610" class="s" font-size="20">① 배터리 커버 제거</text><path d="M340 505 H455" stroke="#064AE8" stroke-width="8"/><path d="M443 490 L465 505 L443 520" fill="#064AE8"/><rect x="505" y="440" width="250" height="140" rx="16" fill="#111827"/><rect x="535" y="468" width="190" height="90" rx="8" fill="#2f3540"/><circle cx="560" cy="500" r="14" fill="#9ca3af"/><circle cx="700" cy="500" r="14" fill="#d92d20"/><path d="M560 500 L500 540" stroke="#111827" stroke-width="10"/><text x="515" y="610" class="s" font-size="20">② 음극(-) 먼저 → 양극(+)</text><path d="M805 505 H900" stroke="#064AE8" stroke-width="8"/><path d="M888 490 L910 505 L888 520" fill="#064AE8"/><rect x="935" y="440" width="80" height="140" rx="12" fill="#111827"/><path d="M975 465 V545" stroke="#6b7280" stroke-width="8"/><path d="M955 520 Q975 555 995 520" fill="none" stroke="#064AE8" stroke-width="7"/><text x="915" y="610" class="s" font-size="20">③ 위로 꺼냄</text></g><rect x="56" y="826" width="1088" height="46" rx="12" fill="#eef4ff"/><text x="76" y="857" class="t" font-size="20">설치 시에는 반대로 진행하되, 단자는 양극(+)을 먼저 연결하고 음극(-)을 마지막에 연결합니다.</text></svg>