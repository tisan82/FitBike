<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">냉각수 누수 흔적 점검 가이드</title><desc id="d">호스 연결부, 라디에이터, 워터펌프와 주차 바닥에서 냉각수 누수 흔적을 확인하는 모바일용 안내 이미지</desc><rect width="1200" height="900" rx="36" fill="#F8FAFC"/><text x="64" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#101828">냉각수가 줄면 누수 흔적을 확인하세요</text><text x="64" y="130" font-family="Arial,sans-serif" font-size="22" fill="#667085">보충만 반복하지 말고 아래 네 곳을 순서대로 확인합니다.</text><g font-family="Arial,sans-serif"><rect x="70" y="190" width="500" height="250" rx="30" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="3"/><circle cx="125" cy="245" r="30" fill="#E8F1FF"/><text x="114" y="256" font-size="28" font-weight="700" fill="#0564D8">1</text><text x="175" y="252" font-size="28" font-weight="700" fill="#101828">호스 연결부</text><path d="M140 335 C230 280 350 285 465 340" fill="none" stroke="#1F2937" stroke-width="42" stroke-linecap="round"/><rect x="284" y="300" width="70" height="70" rx="12" fill="#94A3B8"/><ellipse cx="350" cy="370" rx="26" ry="18" fill="#2EB67D" opacity=".75"/><text x="110" y="415" font-size="21" fill="#667085">젖음·말라붙은 자국·클램프 주변을 확인</text><rect x="630" y="190" width="500" height="250" rx="30" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="3"/><circle cx="685" cy="245" r="30" fill="#E8F1FF"/><text x="674" y="256" font-size="28" font-weight="700" fill="#0564D8">2</text><text x="735" y="252" font-size="28" font-weight="700" fill="#101828">라디에이터</text><rect x="745" y="292" width="250" height="92" rx="12" fill="#334155"/><g stroke="#64748B" stroke-width="5"><line x1="765" y1="305" x2="765" y2="371"/><line x1="795" y1="305" x2="795" y2="371"/><line x1="825" y1="305" x2="825" y2="371"/><line x1="855" y1="305" x2="855" y2="371"/><line x1="885" y1="305" x2="885" y2="371"/><line x1="915" y1="305" x2="915" y2="371"/><line x1="945" y1="305" x2="945" y2="371"/></g><ellipse cx="1010" cy="360" rx="28" ry="18" fill="#2EB67D" opacity=".75"/><text x="670" y="415" font-size="21" fill="#667085">핀·하단 탱크·호스 연결부의 흔적 확인</text><rect x="70" y="485" width="500" height="250" rx="30" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="3"/><circle cx="125" cy="540" r="30" fill="#E8F1FF"/><text x="114" y="551" font-size="28" font-weight="700" fill="#0564D8">3</text><text x="175" y="547" font-size="28" font-weight="700" fill="#101828">워터펌프 주변</text><circle cx="310" cy="640" r="72" fill="#475569" stroke="#94A3B8" stroke-width="8"/><circle cx="310" cy="640" r="25" fill="#CBD5E1"/><ellipse cx="378" cy="682" rx="28" ry="17" fill="#2EB67D" opacity=".75"/><text x="110" y="710" font-size="21" fill="#667085">배수구·커버 하단의 젖음과 결정 자국 확인</text><rect x="630" y="485" width="500" height="250" rx="30" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="3"/><circle cx="685" cy="540" r="30" fill="#E8F1FF"/><text x="674" y="551" font-size="28" font-weight="700" fill="#0564D8">4</text><text x="735" y="547" font-size="28" font-weight="700" fill="#101828">주차 바닥</text><path d="M710 675 H1045" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/><ellipse cx="870" cy="650" rx="66" ry="28" fill="#2EB67D" opacity=".72"/><text x="670" y="710" font-size="21" fill="#667085">반복해서 같은 위치에 액체가 남는지 확인</text><rect x="70" y="775" width="1060" height="75" rx="22" fill="#FFF7D6" stroke="#F4D35E"/><text x="102" y="823" font-size="23" font-weight="700" fill="#7A5B00">누수 흔적이나 과열 경고가 있으면 주행을 계속하지 말고 원인을 점검하세요.</text></g></svg>