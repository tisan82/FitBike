<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Motorcycle coolant reservoir inspection</title>
<desc id="desc">A practical motorcycle coolant reservoir diagram showing FULL and LOW levels, radiator, hoses and leak check points.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151B24"/><stop offset="1" stop-color="#2C3440"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F7FAF8" stop-opacity=".96"/><stop offset="1" stop-color="#DDE7E1" stop-opacity=".9"/></linearGradient>
  <linearGradient id="coolant" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#49C987"/><stop offset="1" stop-color="#199A67"/></linearGradient>
</defs>
<rect width="1200" height="900" rx="44" fill="#F4F7FA"/>
<rect x="36" y="36" width="1128" height="684" rx="38" fill="url(#bg)"/>
<!-- radiator -->
<rect x="82" y="210" width="285" height="420" rx="22" fill="#11161D" stroke="#687381" stroke-width="5"/>
<g stroke="#3F4955" stroke-width="5" opacity=".9">
<path d="M110 240V600M135 240V600M160 240V600M185 240V600M210 240V600M235 240V600M260 240V600M285 240V600M310 240V600M335 240V600"/>
</g>
<!-- hoses -->
<path d="M368 320 C430 305 455 280 510 285" fill="none" stroke="#444B54" stroke-width="42" stroke-linecap="round"/>
<path d="M370 555 C445 565 465 600 535 605" fill="none" stroke="#444B54" stroke-width="42" stroke-linecap="round"/>
<path d="M370 320 C430 305 455 280 510 285" fill="none" stroke="#7F8892" stroke-width="6"/>
<path d="M370 555 C445 565 465 600 535 605" fill="none" stroke="#7F8892" stroke-width="6"/>
<!-- reservoir -->
<rect x="500" y="170" width="360" height="490" rx="72" fill="url(#tank)" stroke="#A9B3BC" stroke-width="6"/>
<rect x="525" y="455" width="310" height="180" rx="36" fill="url(#coolant)" opacity=".95"/>
<rect x="585" y="112" width="190" height="95" rx="28" fill="#161B22" stroke="#7B8490" stroke-width="4"/>
<g stroke="#505964" stroke-width="7"><path d="M605 132V190M628 132V190M651 132V190M674 132V190M697 132V190M720 132V190M743 132V190"/></g>
<!-- level lines -->
<line x1="548" y1="350" x2="812" y2="350" stroke="#1D6FE8" stroke-width="8"/>
<line x1="548" y1="525" x2="812" y2="525" stroke="#1D6FE8" stroke-width="8"/>
<text x="885" y="366" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#EAF2FF">FULL</text>
<text x="885" y="541" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#EAF2FF">LOW</text>
<!-- leak points -->
<g fill="#FFCC66" stroke="#6B4A00" stroke-width="3"><circle cx="485" cy="285" r="18"/><circle cx="500" cy="605" r="18"/><circle cx="368" cy="555" r="18"/></g>
<g font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFF4C2"><text x="900" y="620">LEAK CHECK</text></g>
<!-- mobile-safe instruction strip -->
<rect x="70" y="754" width="1060" height="106" rx="28" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="3"/>
<g font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142033">
<circle cx="125" cy="807" r="26" fill="#1D6FE8"/><text x="117" y="817" fill="#fff">1</text><text x="166" y="817">ENGINE COLD</text>
<circle cx="465" cy="807" r="26" fill="#1D6FE8"/><text x="457" y="817" fill="#fff">2</text><text x="506" y="817">FULL–LOW</text>
<circle cx="785" cy="807" r="26" fill="#1D6FE8"/><text x="777" y="817" fill="#fff">3</text><text x="826" y="817">HOSE / LEAK</text>
</g>
</svg>