<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">오토바이 냉각수 리저버 점검 가이드</title><desc id="desc">엔진이 식은 상태에서 리저버의 FULL과 LOW 사이 냉각수 레벨과 누수 흔적을 확인하는 안내 이미지</desc>
<rect width="1200" height="800" rx="36" fill="#F7F9FC"/>
<text x="64" y="82" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#101828">냉각수는 엔진이 식은 상태에서 확인</text>
<text x="64" y="132" font-family="Arial,sans-serif" font-size="22" fill="#667085">차종별 위치는 다르지만 확인 순서는 같습니다.</text>
<rect x="80" y="195" width="520" height="500" rx="32" fill="#111827"/>
<path d="M160 560 C240 460 300 350 390 300 C455 264 520 285 554 360 L554 612 L150 612 Z" fill="#263244"/>
<rect x="285" y="270" width="205" height="285" rx="38" fill="#ECFDF3" stroke="#98A2B3" stroke-width="6"/>
<rect x="308" y="385" width="159" height="142" rx="18" fill="#2EB67D" opacity=".78"/>
<rect x="330" y="230" width="116" height="58" rx="20" fill="#101828"/>
<line x1="305" y1="365" x2="469" y2="365" stroke="#0564D8" stroke-width="7"/>
<line x1="305" y1="500" x2="469" y2="500" stroke="#0564D8" stroke-width="7"/>
<text x="492" y="372" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0564D8">FULL</text>
<text x="492" y="508" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0564D8">LOW</text>
<circle cx="770" cy="250" r="36" fill="#E8F1FF"/><text x="758" y="261" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0564D8">1</text>
<text x="830" y="244" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#101828">엔진을 충분히 식히기</text>
<text x="830" y="280" font-family="Arial,sans-serif" font-size="21" fill="#667085">고온 상태에서 캡을 열지 않습니다.</text>
<circle cx="770" cy="390" r="36" fill="#E8F1FF"/><text x="758" y="401" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0564D8">2</text>
<text x="830" y="384" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#101828">FULL · LOW 사이인지 확인</text>
<text x="830" y="420" font-family="Arial,sans-serif" font-size="21" fill="#667085">지정된 자세에서 리저버 레벨을 봅니다.</text>
<circle cx="770" cy="530" r="36" fill="#E8F1FF"/><text x="758" y="541" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0564D8">3</text>
<text x="830" y="524" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#101828">호스 · 연결부 누수 확인</text>
<text x="830" y="560" font-family="Arial,sans-serif" font-size="21" fill="#667085">젖음, 말라붙은 흔적, 반복 감소를 확인합니다.</text>
<rect x="680" y="640" width="440" height="92" rx="24" fill="#FFF7D6" stroke="#F4D35E"/>
<text x="712" y="680" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7A5B00">색상만으로 규격을 판단하지 마세요</text>
<text x="712" y="712" font-family="Arial,sans-serif" font-size="19" fill="#7A5B00">제조사가 지정한 냉각수 규격을 우선 확인합니다.</text>
</svg>