<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">수랭식 바이크 냉각계통 위치 확인</title><desc id="d">라디에이터, 리저버 탱크, 호스, 워터펌프의 대략적 위치를 구분한 모바일용 안내 이미지</desc><rect width="1200" height="900" rx="36" fill="#F7F9FC"/><text x="64" y="78" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#101828">냉각계통 위치를 먼저 찾으세요</text><text x="64" y="126" font-family="Arial,sans-serif" font-size="22" fill="#667085">차종마다 실제 위치는 다릅니다. 아래 구성요소를 기준으로 확인하세요.</text><rect x="72" y="180" width="1056" height="560" rx="30" fill="#111827"/><circle cx="300" cy="640" r="95" fill="#1F2937" stroke="#94A3B8" stroke-width="10"/><circle cx="880" cy="640" r="95" fill="#1F2937" stroke="#94A3B8" stroke-width="10"/><path d="M250 575 L390 350 L720 350 L900 575" fill="none" stroke="#64748B" stroke-width="28" stroke-linecap="round"/><rect x="470" y="270" width="230" height="180" rx="24" fill="#334155"/><rect x="370" y="315" width="84" height="210" rx="18" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/><rect x="720" y="305" width="120" height="145" rx="24" fill="#ECFDF3" stroke="#94A3B8" stroke-width="5"/><rect x="738" y="370" width="84" height="58" rx="14" fill="#2EB67D" opacity=".8"/><rect x="752" y="270" width="55" height="42" rx="12" fill="#0F172A"/><path d="M450 380 C500 420 570 440 635 470 C700 505 740 525 800 550" fill="none" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><circle cx="650" cy="505" r="40" fill="#475569" stroke="#CBD5E1" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="24" font-weight="700"><rect x="116" y="250" width="220" height="54" rx="18" fill="#E8F1FF"/><text x="140" y="285" fill="#0564D8">1 라디에이터</text><line x1="336" y1="278" x2="395" y2="355" stroke="#0564D8" stroke-width="5"/><rect x="858" y="220" width="250" height="54" rx="18" fill="#E8F1FF"/><text x="882" y="255" fill="#0564D8">2 리저버 탱크</text><line x1="858" y1="248" x2="812" y2="322" stroke="#0564D8" stroke-width="5"/><rect x="840" y="470" width="220" height="54" rx="18" fill="#E8F1FF"/><text x="864" y="505" fill="#0564D8">3 냉각수 호스</text><line x1="840" y1="500" x2="795" y2="540" stroke="#0564D8" stroke-width="5"/><rect x="485" y="570" width="230" height="54" rx="18" fill="#E8F1FF"/><text x="509" y="605" fill="#0564D8">4 워터펌프</text><line x1="605" y1="570" x2="640" y2="535" stroke="#0564D8" stroke-width="5"/></g><rect x="72" y="770" width="1056" height="80" rx="24" fill="#EEF4FF" stroke="#BFDBFE"/><text x="104" y="820" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#174EA6">실제 점검 전에는 해당 모델의 Owner’s Manual 위치 그림을 우선 확인하세요.</text></svg>